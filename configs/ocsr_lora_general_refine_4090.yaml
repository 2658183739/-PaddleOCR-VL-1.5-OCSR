### data
train_dataset_type: messages
eval_dataset_type: messages
train_dataset_path: ./V2-1/data/sft_materialized/train_singleline_rw_messages.jsonl
train_dataset_prob: "1.0"
eval_dataset_path: ./V2-1/data/sft_materialized/val_singleline_v1p1_messages.jsonl
eval_dataset_prob: "1.0"
max_seq_len: 4096
padding_free: True
truncate_packing: False
dataloader_num_workers: 4
mix_strategy: concat
template_backend: custom
template: paddleocr_vl

### model
model_name_or_path: ./V2-1/outputs/export
_attn_implementation: flashmask
lora: true
lora_rank: 16
copy_custom_file_list: "configuration_paddleocr_vl.py image_processing_paddleocr_vl.py modeling_paddleocr_vl.py processing_paddleocr_vl.py inference.yml"

### finetuning
stage: VL-SFT
fine_tuning: lora
seed: 41
do_train: true
do_eval: false
per_device_eval_batch_size: 2
per_device_train_batch_size: 4
num_train_epochs: 2
max_steps: 700
max_estimate_samples: 500
eval_steps: 100
evaluation_strategy: "no"
save_steps: 100
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 8
logging_dir: ./V2-1/outputs_v2/general_refine_from_v1_sft/visualdl_logs/
output_dir: ./V2-1/outputs_v2/general_refine_from_v1_sft
disable_tqdm: true
eval_accumulation_steps: 16

### train
lr_scheduler_type: cosine
warmup_ratio: 0.05
learning_rate: 1.0e-5
min_lr: 5.0e-7

### optimizer
weight_decay: 0.02
adam_epsilon: 1.0e-8
adam_beta1: 0.9
adam_beta2: 0.95

### performance
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
sharding: stage1
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
bf16: true
fp16_opt_level: O2
pre_alloc_memory: 18

### save
unified_checkpoint: False
save_checkpoint_format: "flex_checkpoint"
load_checkpoint_format: "flex_checkpoint"
