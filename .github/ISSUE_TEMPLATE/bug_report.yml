name: Bug 报告
description: 报告可复现的代码缺陷
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏日志或截图
